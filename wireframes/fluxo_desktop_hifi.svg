<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f6f7fb }
    .card { fill: #ffffff; stroke: #e6e9ef }
    .primary { fill: #0066ff; color: #fff }
    .muted { fill: #6b7280 }
    .title { font-family: Inter, Arial, sans-serif; font-weight: 600; font-size: 20px }
    .label { font-family: Inter, Arial, sans-serif; font-size: 14px }
  </style>
  <rect width="1200" height="800" class="bg"/>

  <!-- Header -->
  <rect x="40" y="24" width="1120" height="64" class="card"/>
  <text x="60" y="64" class="title">No Bico — Busca rápida: serviço + localização</text>

  <!-- Left column: search + results list -->
  <rect x="40" y="110" width="360" height="640" class="card"/>
  <text x="60" y="150" class="label">Filtro • Categoria • Distância • Nota</text>
  <g>
    <rect x="60" y="180" width="320" height="100" rx="8" fill="#fafbff" stroke="#e2e8f0"/>
    <text x="80" y="210" font-family="Inter" font-size="16">Profissional • Selo Ouro • R$ 180</text>
    <text x="80" y="235" font-family="Inter" font-size="12" fill="#6b7280">Avaliação 4.8 — 120 avaliações</text>
  </g>

  <!-- Right column: detalhe do job / chat / checkout -->
  <rect x="420" y="110" width="740" height="420" class="card"/>
  <text x="440" y="150" class="title">Detalhe do Serviço — Orçamento e Chat</text>
  <rect x="440" y="180" width="320" height="160" rx="8" fill="#ffffff" stroke="#eef2ff"/>
  <text x="460" y="210" class="label">Proposta: R$ 250 • Prazo: 2 horas • Incluir fotos</text>
  <rect x="440" y="360" width="320" height="40" rx="6" fill="#0066ff"/>
  <text x="560" y="386" font-family="Inter" font-size="14" fill="#fff" font-weight="600">Depositar em Garantia</text>

  <!-- Checkout panel -->
  <rect x="760" y="180" width="380" height="240" rx="8" fill="#fff" stroke="#e6e9ef"/>
  <text x="780" y="210" class="label">Checkout • Escrow</text>
  <text x="780" y="240" font-family="Inter" font-size="20">Total: R$ 250</text>
  <text x="780" y="270" class="label">Taxa plataforma: 10% (R$ 25)</text>
  <rect x="780" y="300" width="180" height="44" rx="6" fill="#10b981"/>
  <text x="820" y="330" font-family="Inter" font-size="14" fill="#fff">Confirmar & Depositar</text>

  <!-- Execution & Evidence area -->
  <rect x="420" y="540" width="740" height="210" class="card"/>
  <text x="440" y="580" class="label">Execução — Upload de evidências</text>
  <rect x="440" y="610" width="260" height="120" rx="8" fill="#fafbff" stroke="#e6e9ef"/>
  <text x="460" y="650" class="label">Adicionar foto(s) com timestamp • Assinatura do cliente</text>
  <rect x="760" y="650" width="200" height="40" rx="6" fill="#0066ff"/>
  <text x="800" y="678" font-family="Inter" font-size="14" fill="#fff">Enviar Evidências</text>

  <!-- Footer / Release -->
  <rect x="40" y="760" width="1120" height="30" fill="#fff" opacity="0.6"/>
  <text x="60" y="781" class="label">Status: Em Execução • Auto-release em 7 dias • Botão 'Liberar Pagamento' disponível após evidências</text>
</svg>
