name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; else echo "No package.json — skipping install"; fi

      - name: Lint
        run: |
          if [ -f package.json ]; then npm run lint; else echo "No package.json — skipping lint"; fi

      - name: Test
        run: |
          if [ -f package.json ]; then npm test; else echo "No package.json — skipping tests"; fi
